<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="DriveFlow">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B132B"/>
      <stop offset="0.55" stop-color="#101A3A"/>
      <stop offset="1" stop-color="#1C2541"/>
    </linearGradient>
    <radialGradient id="glowElectric" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4CC9F0" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#4CC9F0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGrape" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3A0CA3" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#3A0CA3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4CC9F0"/>
      <stop offset="1" stop-color="#3A0CA3"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4CC9F0"/>
      <stop offset="0.5" stop-color="#8EDDF4"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="26" stdDeviation="34" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <circle cx="240" cy="120" r="420" fill="url(#glowGrape)"/>
  <circle cx="1380" cy="780" r="460" fill="url(#glowElectric)"/>
  <circle cx="820" cy="470" r="540" fill="url(#glowElectric)" opacity="0.45"/>

  <g opacity="0.35">
    <path d="M0 180 H1600" stroke="#ffffff" stroke-opacity="0.05"/>
    <path d="M0 360 H1600" stroke="#ffffff" stroke-opacity="0.05"/>
    <path d="M0 540 H1600" stroke="#ffffff" stroke-opacity="0.05"/>
    <path d="M0 720 H1600" stroke="#ffffff" stroke-opacity="0.05"/>
    <path d="M400 0 V900" stroke="#ffffff" stroke-opacity="0.05"/>
    <path d="M800 0 V900" stroke="#ffffff" stroke-opacity="0.05"/>
    <path d="M1200 0 V900" stroke="#ffffff" stroke-opacity="0.05"/>
  </g>

  <g transform="translate(300,560)">
    <rect x="0" y="0" width="150" height="180" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14"/>
    <rect x="18" y="20" width="114" height="22" rx="11" fill="#4CC9F0" fill-opacity="0.9"/>
    <rect x="18" y="62" width="90" height="12" rx="6" fill="#ffffff" fill-opacity="0.4"/>
    <rect x="18" y="88" width="114" height="12" rx="6" fill="#ffffff" fill-opacity="0.24"/>
    <rect x="18" y="112" width="70" height="12" rx="6" fill="#ffffff" fill-opacity="0.24"/>
    <rect x="18" y="142" width="60" height="20" rx="10" fill="#3A0CA3" fill-opacity="0.9"/>
  </g>

  <g transform="translate(1150,250)">
    <rect x="0" y="0" width="170" height="120" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14"/>
    <rect x="18" y="18" width="134" height="10" rx="5" fill="#ffffff" fill-opacity="0.14"/>
    <rect x="18" y="18" width="120" height="10" rx="5" fill="url(#cloud)"/>
    <text x="18" y="82" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#8EDDF4">Upload complete</text>
    <text x="18" y="104" font-family="system-ui, sans-serif" font-size="12" fill="#64748B">100% · stored to My Drive</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="744" y="248" width="112" height="112" rx="30" fill="url(#cloud)"/>
    <g transform="translate(800,304) scale(1.75) translate(-32,-32)" fill="#ffffff">
      <path d="M32 18l-4.5 3v20.5l4.5 3 8-6.5v-14L32 18z" opacity="0.35"/>
      <path d="M16 36l9-7 7 10 7-6 9 9v7H16v-13z"/>
      <path d="M48 30l-9 7-7-10-7 6-9-9V12h32v18z" opacity="0.9"/>
    </g>
  </g>

  <text x="800" y="472" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="76" font-weight="700" letter-spacing="2" fill="url(#wordmark)">DriveFlow</text>
  <text x="800" y="520" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="400" letter-spacing="6" fill="#7C8DB5">UPLOAD · AUTOMATE · DELIVER</text>
</svg>
