steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/driveflow:$COMMIT_SHA"
      - "--build-arg"
      - "VITE_FIREBASE_API_KEY=${_VITE_FIREBASE_API_KEY}"
      - "--build-arg"
      - "VITE_FIREBASE_AUTH_DOMAIN=${_VITE_FIREBASE_AUTH_DOMAIN}"
      - "--build-arg"
      - "VITE_FIREBASE_PROJECT_ID=${_VITE_FIREBASE_PROJECT_ID}"
      - "--build-arg"
      - "VITE_FIREBASE_STORAGE_BUCKET=${_VITE_FIREBASE_STORAGE_BUCKET}"
      - "--build-arg"
      - "VITE_FIREBASE_MESSAGING_SENDER_ID=${_VITE_FIREBASE_MESSAGING_SENDER_ID}"
      - "--build-arg"
      - "VITE_FIREBASE_APP_ID=${_VITE_FIREBASE_APP_ID}"
      - "--build-arg"
      - "VITE_FIREBASE_MEASUREMENT_ID=${_VITE_FIREBASE_MEASUREMENT_ID}"
      - "--build-arg"
      - "VITE_GOOGLE_CLIENT_ID=${_VITE_GOOGLE_CLIENT_ID}"
      - "."
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/driveflow:$COMMIT_SHA"
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "driveflow"
      - "--image"
      - "gcr.io/$PROJECT_ID/driveflow:$COMMIT_SHA"
      - "--region"
      - "us-central1"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--memory"
      - "512Mi"
      - "--set-env-vars"
      - "GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID},GOOGLE_CLIENT_SECRET=${_GOOGLE_CLIENT_SECRET},GOOGLE_CLOUD_PROJECT=${_GOOGLE_CLOUD_PROJECT},GEMINI_SECRET_NAME=${_GEMINI_SECRET_NAME}"
images:
  - "gcr.io/$PROJECT_ID/driveflow:$COMMIT_SHA"

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _VITE_FIREBASE_API_KEY: "YOUR_API_KEY"
  _VITE_FIREBASE_AUTH_DOMAIN: "n8nsampleproject-ff2c5.firebaseapp.com"
  _VITE_FIREBASE_PROJECT_ID: "n8nsampleproject-ff2c5"
  _VITE_FIREBASE_STORAGE_BUCKET: "n8nsampleproject-ff2c5.firebasestorage.app"
  _VITE_FIREBASE_MESSAGING_SENDER_ID: "984526389105"
  _VITE_FIREBASE_APP_ID: "1:984526389105:web:ceb065d624b8f17ab780d0"
  _VITE_FIREBASE_MEASUREMENT_ID: "G-LTEHW0ZLRS"
  _VITE_GOOGLE_CLIENT_ID: "984526389105-78jesfj2ga9htpi8f8uuqqnchr3nj607.apps.googleusercontent.com"
  _GOOGLE_CLIENT_ID: "984526389105-78jesfj2ga9htpi8f8uuqqnchr3nj607.apps.googleusercontent.com"
  _GOOGLE_CLIENT_SECRET: "REPLACE_WITH_ACTUAL_SECRET"
  _GOOGLE_CLOUD_PROJECT: "n8nsampleproject-ff2c5"
  _GEMINI_SECRET_NAME: "gemini-api-key"
